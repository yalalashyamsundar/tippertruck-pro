
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Tipperlog Manager</title>
    
    <!-- PWA & iOS Home Screen Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tipperlog">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#121212">
    
    <!-- Icons -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23FFD700'/%3E%3Cg transform='translate(25, 33)'%3E%3Cpath d='M3 0h20c2.2 0 4 1.8 4 4v22H0V4c0-2.2 1.8-4 4-4z' fill='none' stroke='black' stroke-width='4.5' stroke-linejoin='round'/%3E%3Cpath d='M27 10h12c1.1 0 2.1.6 2.6 1.5l5.8 8.7c.4.6.6 1.2.6 1.8v8H27V10z' fill='none' stroke='black' stroke-width='4.5' stroke-linejoin='round' stroke-linecap='round'/%3E%3Ccircle cx='7' cy='31' r='4.5' fill='black'/%3E%3Ccircle cx='34' cy='31' r='4.5' fill='black'/%3E%3C/g%3E%3C/svg%3E">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23FFD700'/%3E%3Cg transform='translate(25, 33)'%3E%3Cpath d='M3 0h20c2.2 0 4 1.8 4 4v22H0V4c0-2.2 1.8-4 4-4z' fill='none' stroke='black' stroke-width='4.5' stroke-linejoin='round'/%3E%3Cpath d='M27 10h12c1.1 0 2.1.6 2.6 1.5l5.8 8.7c.4.6.6 1.2.6 1.8v8H27V10z' fill='none' stroke='black' stroke-width='4.5' stroke-linejoin='round' stroke-linecap='round'/%3E%3Ccircle cx='7' cy='31' r='4.5' fill='black'/%3E%3Ccircle cx='34' cy='31' r='4.5' fill='black'/%3E%3C/g%3E%3C/svg%3E">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      window.process = { env: { API_KEY: "" } };
      
      // Service Worker Registration for Push
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(reg => {
            console.log('SW Registered', reg);
          }).catch(err => {
            console.log('SW Registration failed', err);
          });
        });
      }

      window.onerror = function(msg, url, line, col, error) {
        const root = document.getElementById('root');
        if (root) {
          root.innerHTML = `
            <div style="padding: 20px; background: #121212; color: #ff4444; font-family: -apple-system, sans-serif; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;">
              <h1 style="color: #FFD700; font-weight: 900; font-size: 24px; text-transform: uppercase;">⚠️ Startup Error</h1>
              <p style="background: #1a1a1a; padding: 20px; border-radius: 24px; border: 1px solid #333; margin-top: 20px; font-size: 14px; color: #aaa;">
                ${msg}
              </p>
              <button onclick="location.reload()" style="background: #FFD700; color: black; border: none; padding: 16px 32px; border-radius: 20px; font-weight: 900; margin-top: 30px; text-transform: uppercase; letter-spacing: 1px;">Reload App</button>
            </div>
          `;
        }
        return false;
      };
    </script>
    <style>
      :root {
        --sat: env(safe-area-inset-top);
        --sar: env(safe-area-inset-right);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
      }
      body {
        background-color: #09090b; /* Zinc-950 */
        color: #f4f4f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-tap-highlight-color: transparent;
        overflow-x: hidden;
        min-height: 100vh;
        min-height: -webkit-fill-available;
      }
      .bg-safety-yellow { background-color: #FFD700; }
      .text-safety-yellow { color: #FFD700; }
      .border-safety-yellow { border-color: #FFD700; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19.0.0",
        "react-dom": "https://esm.sh/react-dom@19.0.0",
        "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.460.0?external=react",
        "@google/genai": "https://esm.sh/@google/genai@1.3.0",
        "date-fns": "https://esm.sh/date-fns@4.1.0",
        "jspdf": "https://esm.sh/jspdf@2.5.1",
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.48.1",
        "react/": "https://esm.sh/react@^19.2.4/",
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
  </body>
</html>
