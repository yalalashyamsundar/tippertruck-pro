
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Tipperlog Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Shim process.env and identify errors immediately
      window.process = window.process || { env: {} };
      
      // Global Error Handler to catch "Blank Screen" culprits
      window.onerror = function(msg, url, line, col, error) {
        const root = document.getElementById('root');
        if (root) {
          root.innerHTML = `
            <div style="padding: 20px; background: #1a1a1a; color: #ff4444; font-family: monospace; height: 100vh;">
              <h1 style="color: #FFD700;">⚠️ Application Crash</h1>
              <p><strong>Error:</strong> ${msg}</p>
              <p><strong>Location:</strong> ${url}:${line}:${col}</p>
              <button onclick="location.reload()" style="background: #FFD700; color: black; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; margin-top: 20px;">Reload App</button>
            </div>
          `;
        }
        return false;
      };
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap');
      body {
        background-color: #121212;
        color: #f4f4f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      .bg-safety-yellow { background-color: #FFD700; }
      .text-safety-yellow { color: #FFD700; }
      .border-safety-yellow { border-color: #FFD700; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.460.0?external=react",
    "@google/genai": "https://esm.sh/@google/genai@1.3.0",
    "date-fns": "https://esm.sh/date-fns@4.1.0",
    "jspdf": "https://esm.sh/jspdf@2.5.1",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.48.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
